<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>知序 · Wiki 知识工作台</title>
    <link rel="stylesheet" href="/wiki-preview.css">
    <script type="module" src="/wiki-preview.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">跳至内容</a>
    <div class="wiki-shell">
      <aside class="sidebar" aria-label="工作台导航" id="sidebar"></aside>
      <div class="workspace">
        <header class="topbar" id="topbar"></header>
        <div class="preview-notice"><span class="preview-badge">前端确认版</span><span>内容为合成示例 · 尚未连接后端或模型，所有操作仅供交互预览</span></div>
        <main id="content" class="content" tabindex="-1"></main>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="import-dialog" class="preview-dialog" aria-labelledby="import-title">
      <form method="dialog" class="dialog-head"><h2 id="import-title">导入原始资料</h2><button class="icon-button" aria-label="关闭导入窗口" value="close">×</button></form>
      <div class="dialog-body">
        <p class="notice">本次仅预览导入流程。文件留在你的电脑中，不读取正文、不上传，也不会进行模型处理。</p>
        <label class="drop-zone" for="preview-files"><strong>选择文件，查看导入清单</strong><span>文档、图片、音频与视频</span><input id="preview-files" type="file" multiple></label>
        <div id="upload-list" class="upload-list" aria-live="polite"></div>
      </div>
      <div class="dialog-actions"><button class="button secondary" data-action="close-import">取消</button><button class="button primary" id="confirm-import" data-action="confirm-import" disabled>加入预览清单</button></div>
    </dialog>
    <noscript>此前端交互预览需要启用 JavaScript。</noscript>
  </body>
</html>
