<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>知序 · Wiki 知识工作台</title>
    <link rel="stylesheet" href="/wiki-preview.css">
    <link rel="stylesheet" href="/wiki-workspace.css">
    <script type="module" src="/wiki-workspace.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">跳至内容</a>
    <div class="wiki-shell">
      <aside class="sidebar" aria-label="工作台导航" id="sidebar"></aside>
      <div class="workspace">
        <header class="topbar" id="topbar"></header>
        <main id="content" class="content" tabindex="-1" aria-live="polite"></main>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="import-dialog" class="preview-dialog" aria-labelledby="import-title">
      <form method="dialog" class="dialog-head"><h2 id="import-title">导入原始资料</h2><button class="icon-button" aria-label="关闭导入窗口" value="close">×</button></form>
      <div class="dialog-body">
        <div class="field"><label for="upload-kind">上传类型</label><select id="upload-kind"><option value="document">文档 / 图片</option><option value="audio">音频转录</option><option value="video">视频文字</option></select></div>
        <label class="drop-zone" for="workspace-files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></svg><strong>点击选择要导入的原文件，或把文件、文件夹拖到这里</strong><span class="drop-zone-hint">可一次选择多个；单个文件不超过 20 MiB，图片不超过 10 MiB</span><input id="workspace-files" type="file" multiple></label>
        <div class="folder-pick"><button type="button" class="button small secondary" data-action="choose-folder">选择文件夹</button><span class="drop-zone-hint">包含子文件夹；隐藏文件和不支持的格式会自动跳过</span><input id="workspace-folder" type="file" webkitdirectory multiple hidden></div>
        <div id="upload-skipped" class="upload-skipped" hidden></div>
        <div id="import-organization" hidden><div class="field"><label for="import-target-folder">导入到目录</label><select id="import-target-folder"><option value="">未分类</option></select></div><label class="check-field" for="import-preserve-paths"><input id="import-preserve-paths" type="checkbox">保留文件夹结构</label></div>
        <div class="field budget-field" id="budget-field"><label for="batch-budget">本批嵌入请求上限（可选）</label><input id="batch-budget" type="number" inputmode="numeric" min="1" max="1000000" step="1" placeholder="不填则使用默认上限"><p class="field-hint" id="budget-estimate" aria-live="polite"></p></div>
        <label class="check-field" for="include-duplicates"><input id="include-duplicates" type="checkbox"> 重复文件也导入<span class="drop-zone-hint">默认跳过与已有资料内容完全相同（SHA-256 一致）的文件</span></label>
        <div id="upload-list" class="upload-list" aria-live="polite"></div>
      </div>
      <div class="dialog-actions"><button class="button secondary" data-action="close-import">取消</button><button class="button primary" id="confirm-import" data-action="confirm-import" disabled>确认导入</button></div>
    </dialog>
    <dialog id="action-confirm-dialog" class="preview-dialog operation-dialog" aria-labelledby="action-confirm-title" aria-describedby="action-confirm-message">
      <div class="dialog-head"><h2 id="action-confirm-title">确认操作</h2><button type="button" class="icon-button" data-action="cancel-operation" aria-label="取消并关闭确认窗口">×</button></div>
      <div class="dialog-body"><p id="action-confirm-message" class="preserve-lines"></p></div>
      <div class="dialog-actions"><button type="button" class="button secondary" id="action-confirm-cancel" data-action="cancel-operation" autofocus>取消</button><button type="button" class="button primary" data-action="confirm-operation">确认并继续</button></div>
    </dialog>
    <noscript>知识工作台需要启用 JavaScript。</noscript>
  </body>
</html>
